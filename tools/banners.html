<!DOCTYPE html>
<html lang="en">
<head>

  <style>

      align-items: center;
    }
    img {
      max-width: 100%;
      height: auto;
      border: 0;
      display: inline-block;
      vertical-align:top;
      transition: opacity 0.3s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="ad-slot"></div>

  <script>
    var campaigns = {
      bestchange: {

                side: "https://www.bestchange.com/?p=605104" },
        top: [

          "https://www.bestchange.com/images/banners/100x100-25.gif",
          "https://www.bestchange.com/images/banners/468x60-16.gif",

          "https://www.bestchange.com/images/banners/468x60-20.jpg",
          "https://www.bestchange.com/images/banners/468x60-22.gif",
          "https://www.bestchange.com/images/banners/468x60-25.jpg",
          "https://www.bestchange.com/images/banners/468x60-27.jpg",
          "https://www.bestchange.com/images/banners/468x60-29.gif",
          "https://www.bestchange.com/images/banners/728x90-12.gif",
          "https://www.bestchange.com/images/banners/728x90-14.jpg",
          "https://www.bestchange.com/images/banners/728x90-16.jpg",
          "https://www.bestchange.com/images/banners/728x90-18.gif",
          "https://www.bestchange.com/images/banners/728x90-20.jpg",
          "https://www.bestchange.com/images/banners/728x90-22.jpg",
          "https://www.bestchange.com/images/banners/728x90-24.gif",
          "https://www.bestchange.com/images/banners/848x128-2.gif",
          "https://www.bestchange.com/images/banners/848x128-4.gif",
          "https://www.bestchange.com/images/banners/300x600-2.gif",
          "https://www.bestchange.com/images/banners/300x600-4.jpg",
          "https://www.bestchange.com/images/banners/300x600-6.jpg",
          "https://www.bestchange.com/images/banners/300x600-8.gif",
          "https://www.bestchange.com/images/banners/240x400-10.gif",
          "https://www.bestchange.com/images/banners/240x400-12.jpg",
          "https://www.bestchange.com/images/banners/240x400-14.jpg",
          "https://www.bestchange.com/images/banners/240x400-16.gif",
          "https://www.bestchange.com/images/banners/240x400-18.jpg",
          "https://www.bestchange.com/images/banners/240x400-20.jpg",
          "https://www.bestchange.com/images/banners/240x400-22.gif"          
        ],
        side: [
          "https://www.bestchange.com/images/banners/120x600-7.gif",
          "https://www.bestchange.com/images/banners/120x600-9.jpg",
          "https://www.bestchange.com/images/banners/120x600-11.jpg",
          "https://www.bestchange.com/images/banners/120x600-13.gif",

          "https://www.bestchange.com/images/banners/160x600-11.jpg",
          "https://www.bestchange.com/images/banners/160x600-13.gif",
          "https://www.bestchange.com/images/banners/160x600-15.jpg",
          "https://www.bestchange.com/images/banners/160x600-17.jpg",
          "https://www.bestchange.com/images/banners/160x600-20.gif"          
        ]
      }/*,
      otherprogram: {
        link: "https://your-other-affiliate-link.com",
        top: [
          "https://example.com"
        ],
        side: [
          "https://example.com"
        ]
      }*/
    };

    var params = new URLSearchParams(window.location.search);
    var programName = params.get("program") || "bestchange";
    var slotName = params.get("slot") || "top";
    var altName = params.get("alt") || "Online-money exchanger list";
    var titleName = params.get("title") || "E-currency exchanger monitor BestChange";
    var seconds = parseInt(params.get("speed"), 10);
    if (isNaN(seconds)) seconds = 20; // Default: 20 seconds (set ?speed=0 to disable timer)

    var selectedCampaign = campaigns[programName] || campaigns.bestchange;
    var imageList = selectedCampaign[slotName] || selectedCampaign.top;
    var currentIndex = Math.floor(Math.random() * imageList.length);
    var isHovered = false;
    var adSlot = document.getElementById("ad-slot");

    function renderBanner() {
      adSlot.innerHTML =
        '<a href="' + selectedCampaign.link[slotName] + '" title="' + titleName + '" target="_blank" rel="noopener">' +
          '<img src="' + imageList[currentIndex] + '" alt="' + altName + '">' +
        '</a>';
    }

    // Pause rotation if user hovers mouse over the banner to click it
    adSlot.addEventListener("mouseenter", function() { isHovered = true; });
    adSlot.addEventListener("mouseleave", function() { isHovered = false; });

    // Initial random load
    renderBanner();

    // Rotate cleanly through remaining banners without repeating back-to-back
    if (seconds > 0 && imageList.length > 1) {
      setInterval(function() {
        if (!isHovered) {
          currentIndex = (currentIndex + 1) % imageList.length;
          renderBanner();
        }
      }, seconds * 1000);
    }

   function sendHeight() {
      var slotBox = document.getElementById("ad-slot");
      var height = slotBox ? slotBox.getBoundingClientRect().height : 0;
      if (height > 0) {
        window.parent.postMessage({ mySlot: slotName, myHeight: height }, "*");
      }
    }

  if (window.ResizeObserver) {
    new ResizeObserver(sendHeight).observe(document.getElementById("ad-slot"));
  }

  // Send height as soon as the image finishes loading and whenever the window resizes
  var bannerImg = document.querySelector("#ad-slot img");
  if (bannerImg) {
    bannerImg.onload = sendHeight;
    if (bannerImg.complete) sendHeight();
  }
  window.addEventListener("load", sendHeight);  
  window.addEventListener("resize", sendHeight);
    
  </script>
</body>
</html>
